<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found &mdash; Joyful Noise</title>
<meta name="description" content="That page doesn't exist. Head back to the Joyful Noise homepage.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#27592C">

<link rel="icon" href="/assets/favicon.png" sizes="any">
<link rel="icon" type="image/png" href="/assets/favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap">
<link rel="stylesheet" href="/styles.css">

<style>
  /* 404 uses absolute paths so it renders correctly from any URL depth */
  .error-page{
    min-height: 100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 60px 24px;
    background: radial-gradient(120% 90% at 50% 18%, #3D7C43 0%, #27592C 46%, #163A1B 100%);
    color: var(--white);
  }
  .error-code{
    font-family: var(--f-display);
    font-size: clamp(4.5rem, 16vw, 9rem);
    font-weight: 500;
    line-height: 1;
    color: var(--gold-soft);
    margin: 0;
  }
  .error-page h1{
    color: var(--white);
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 500;
    margin: 18px 0 0;
  }
  .error-page p{
    color: rgba(255,255,255,.82);
    max-width: 430px;
    margin: 16px auto 38px;
  }
  .error-actions{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .error-page .rest{
    font-family: var(--f-hero);
    font-size: .8rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-top: 46px;
  }
</style>
</head>
<body>

<section class="error-page">
  <p class="error-code" aria-hidden="true">404</p>
  <h1>This note isn't in our range</h1>
  <p>The page you're looking for doesn't exist, or it may have moved. Let's get you back to somewhere we can sing.</p>
  <div class="error-actions">
    <a href="/" class="btn btn-outline-light">Back to home</a>
    <a href="/events.html" class="btn btn-outline-light">Upcoming events</a>
  </div>
  <p class="rest">&#9835; Rest &#9835;</p>
</section>

</body>
</html>
